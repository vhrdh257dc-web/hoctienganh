/* ============================== HELPERS ============================== */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildVocabPool() {
  const all = VOCAB_CATEGORIES.flatMap((c) => c.words.map((w) => ({ ...w, cat: c.id })));
  return all.map((w) => {
    const distractors = shuffle(all.filter((o) => o.vi !== w.vi)).slice(0, 3).map((o) => o.vi);
    const options = shuffle([w.vi, ...distractors]);
    return { type: "vocab", prompt: `Từ "${w.en}" có nghĩa là gì?`, options, correctAnswer: w.vi };
  });
}
function buildGrammarPool() {
  return GRAMMAR_QUIZ.map((q) => ({
    type: "grammar", prompt: q.prompt, options: q.options, correctAnswer: q.options[q.correct], topic: q.topic,
  }));
}
function todayStr() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
}

  const openCategory = (idx) => { setCatIndex(idx); setCardIndex(0); setFlipped(false); goto("vocabDeck"); };
  const markKnown = (id) => setKnownWords((prev) => ({ ...prev, [id]: true }));
  const nextCard = () => { setFlipped(false); const cat = VOCAB_CATEGORIES[catIndex]; setCardIndex((i) => (i + 1) % cat.words.length); };
  const prevCard = () => { setFlipped(false); const cat = VOCAB_CATEGORIES[catIndex]; setCardIndex((i) => (i - 1 + cat.words.length) % cat.words.length); };

  const startQuiz = () => {
    let pool = [];
    if (quizFilter === "all") pool = [...buildVocabPool(), ...buildGrammarPool()];
    else if (quizFilter === "vocab") pool = buildVocabPool();
    else pool = buildGrammarPool();
    const picked = shuffle(pool).slice(0, Math.min(quizCount, pool.length));
    setQuizQuestions(picked); setQuizIndex(0); setQuizAnswers([]); setSelectedOption(null); setQuizStage("active");
  };
  const answerQuiz = (opt) => {
    if (selectedOption !== null) return;
    setSelectedOption(opt);
    const q = quizQuestions[quizIndex];
    const correct = opt === q.correctAnswer;
    setQuizAnswers((prev) => [...prev, { ...q, chosen: opt, correct }]);
  };
  const nextQuestion = () => {
    if (quizIndex + 1 >= quizQuestions.length) setQuizStage("result");
    else { setQuizIndex((i) => i + 1); setSelectedOption(null); }
  };
  const finalScore = quizAnswers.filter((a) => a.correct).length;
  const saveScore = () => {
    const name = playerName.trim() || "Bạn";
    const entry = { name, score: finalScore, total: quizQuestions.length, date: todayStr() };
    setLeaderboard((prev) => [...prev, entry].sort((a, b) => b.score / b.total - a.score / a.total).slice(0, 8));
    setBestScore((prev) => (prev === null ? finalScore : Math.max(prev, finalScore)));
    setNameSaved(true);
  };
  const resetQuiz = () => { setQuizStage("setup"); setQuizIndex(0); setQuizAnswers([]); setSelectedOption(null); setNameSaved(false); };

  return (
    <div style={{ minHeight: "100vh", background: T.paper,
      backgroundImage: "radial-gradient(circle at 1px 1px, rgba(28,42,66,0.06) 1px, transparent 0)",
      backgroundSize: "18px 18px", fontFamily: "'Inter', sans-serif", color: T.ink }}>

      <header style={{ borderBottom: `1px solid ${T.line}`, position: "sticky", top: 0, zIndex: 20,
        background: "rgba(243,238,225,0.92)", backdropFilter: "blur(6px)" }}>
        <div style={{ maxWidth: 1080, margin: "0 auto", padding: "16px 24px" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: "8px 14px", marginBottom: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }} onClick={() => goto("home")}>
              <Plane size={22} color={T.stamp} style={{ transform: "rotate(-45deg)", flexShrink: 0 }} />
              <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 21, letterSpacing: "-0.01em", whiteSpace: "nowrap" }}>TOEIC Passport</span>
            </div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, color: T.inkSoft, display: "flex", gap: 12, flexWrap: "wrap" }}>
              <span>TỪ: {totalWordsSeen}</span>
              <span>ĐIỂM CAO: {bestScore ?? "—"}</span>
            </div>
          </div>
          <nav className="tab-scroll" style={{ display: "flex", gap: 6, overflowX: "auto" }}>
            <NavTab active={view === "home"} onClick={() => goto("home")} icon={Home} label="Trang chủ" />
            <NavTab active={view === "grammar" || view === "grammarDetail"} onClick={() => goto("grammar")} icon={BookOpen} label="Ngữ pháp" />
            <NavTab active={view === "vocab" || view === "vocabDeck"} onClick={() => goto("vocab")} icon={Layers} label="Từ vựng" />
            <NavTab active={view === "quiz"} onClick={() => { resetQuiz(); goto("quiz"); }} icon={Target} label="Luyện tập" />
            <NavTab active={view === "leaderboard"} onClick={() => goto("leaderboard")} icon={Trophy} label="Bảng xếp hạng" />
          </nav>
        </div>
      </header>

      <main style={{ maxWidth: 1080, margin: "0 auto", padding: "36px 24px 72px" }}>
        {view === "home" && <HomeView goto={goto} totalWordsSeen={totalWordsSeen} bestScore={bestScore} openTopic={openTopic} />}
        {view === "grammar" && <GrammarListView onOpen={openTopic} />}
        {view === "grammarDetail" && selectedTopic && (
          <GrammarDetailView topic={selectedTopic} onBack={() => goto("grammar")}
            onQuiz={() => { resetQuiz(); setQuizFilter("grammar"); goto("quiz"); }} />
        )}
        {view === "vocab" && <VocabHubView onOpen={openCategory} knownWords={knownWords} />}
        {view === "vocabDeck" && (
          <VocabDeckView category={VOCAB_CATEGORIES[catIndex]} cardIndex={cardIndex} flipped={flipped}
            setFlipped={setFlipped} onNext={nextCard} onPrev={prevCard} onBack={() => goto("vocab")}
            markKnown={markKnown} knownWords={knownWords} />
        )}
        {view === "quiz" && quizStage === "setup" && (
          <QuizSetupView quizFilter={quizFilter} setQuizFilter={setQuizFilter} quizCount={quizCount}
            setQuizCount={setQuizCount} onStart={startQuiz} />
        )}
        {view === "quiz" && quizStage === "active" && quizQuestions.length > 0 && (
          <QuizActiveView question={quizQuestions[quizIndex]} index={quizIndex} total={quizQuestions.length}
            selectedOption={selectedOption} onAnswer={answerQuiz} onNext={nextQuestion} />
        )}
        {view === "quiz" && quizStage === "result" && (
          <QuizResultView score={finalScore} total={quizQuestions.length} answers={quizAnswers}
            playerName={playerName} setPlayerName={setPlayerName} nameSaved={nameSaved}
            onSave={saveScore} onRetry={resetQuiz} onLeaderboard={() => goto("leaderboard")} />
        )}
        {view === "leaderboard" && <LeaderboardView leaderboard={leaderboard} />}
      </main>

      <footer style={{ borderTop: `1px solid ${T.line}`, padding: "20px 24px", textAlign: "center", color: T.inkSoft, fontSize: 13 }}>
        Bản demo tự học TOEIC — nội dung chỉ mang tính minh họa.
      </footer>
    </div>
  );
}

function QuizActiveView({ question, index, total, selectedOption, onAnswer, onNext }) {
  const progress = (index / total) * 100;
  return (
    <div style={{ maxWidth: 560, margin: "0 auto" }}>
      <div style={{ height: 6, background: T.paperDeep, borderRadius: 999, overflow: "hidden", marginBottom: 20 }}>
        <div style={{ height: "100%", width: `${progress}%`, background: T.stamp, transition: "width 0.3s ease" }} />
      </div>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, color: T.inkSoft, marginBottom: 10 }}>Câu {index + 1} / {total}</div>
      <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 16, padding: "26px 24px", marginBottom: 20 }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 21, fontWeight: 600, lineHeight: 1.4 }}>{question.prompt}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 22 }}>
        {question.options.map((opt, i) => {
          const isSelected = selectedOption === opt;
          const isCorrect = opt === question.correctAnswer;
          let bg = "transparent", border = T.line;
          if (selectedOption !== null) {
            if (isCorrect) { bg = "rgba(44,110,104,0.12)"; border = T.teal; }
            else if (isSelected && !isCorrect) { bg = "rgba(162,59,46,0.10)"; border = T.stamp; }
          }
          return (
            <button key={i} className="quiz-opt app-btn" disabled={selectedOption !== null} onClick={() => onAnswer(opt)}
              style={{ textAlign: "left", padding: "13px 16px", borderRadius: 12, border: `1.5px solid ${border}`,
                background: bg, color: T.ink, fontSize: 15, cursor: selectedOption !== null ? "default" : "pointer",
                display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              {opt}
              {selectedOption !== null && isCorrect && <Check size={17} color={T.teal} />}
              {selectedOption !== null && isSelected && !isCorrect && <XIcon size={17} color={T.stamp} />}
            </button>
          );
        })}
      </div>
      {selectedOption !== null && (
        <button className="app-btn" onClick={onNext} style={{ ...primaryBtnStyle(), width: "100%", justifyContent: "center" }}>
          {index + 1 >= total ? "Xem kết quả" : "Câu tiếp theo"} <ChevronRight size={16} />
        </button>
      )}
    </div>
  );
}

        </p>
      </div>
      {!nameSaved ? (

          <button className="app-btn" onClick={onSave} style={primaryBtnStyle()}>Lưu vào bảng xếp hạng <Trophy size={15} /></button>
        </div>
      ) : (
        <div style={{ textAlign: "center", color: T.teal, fontWeight: 600, marginBottom: 20 }}>✓ Đã lưu kết quả vào bảng xếp hạng</div>

      {missed.length > 0 && (
        <>
          <SectionEyebrow>Xem lại câu sai</SectionEyebrow>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
            {missed.map((m, i) => (
              <div key={i} style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 12, padding: "13px 16px" }}>
                <div style={{ fontWeight: 600, marginBottom: 5 }}>{m.prompt}</div>
                <div style={{ fontSize: 13.5, color: T.stamp }}>Bạn chọn: {m.chosen}</div>
                <div style={{ fontSize: 13.5, color: T.teal }}>Đáp án đúng: {m.correctAnswer}</div>
              </div>
            ))}
          </div>
        </>
      )}
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <button className="app-btn" onClick={onRetry} style={ghostBtnStyle()}><RotateCcw size={16} /> Làm lại</button>
        <button className="app-btn" onClick={onLeaderboard} style={primaryBtnStyle()}>Xem bảng xếp hạng <ChevronRight size={16} /></button>
      </div>
    </div>
  );
}
function LeaderboardView({ leaderboard }) {
  const sorted = [...leaderboard].sort((a, b) => b.score / b.total - a.score / a.total);
  const medalColor = (i) => (i === 0 ? T.gold : i === 1 ? "#9AA3B2" : i === 2 ? "#B08355" : T.line);
  return (
    <div>
      <SectionEyebrow>Sổ danh sách hành khách</SectionEyebrow>
      <h2 style={{ fontFamily: "'Fraunces', serif", fontSize: 30, margin: "0 0 22px" }}>Bảng xếp hạng</h2>
      <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 16, overflow: "hidden" }}>
        {sorted.map((row, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 20px",
            borderBottom: i < sorted.length - 1 ? `1px dashed ${T.line}` : "none" }}>
            <div style={{ width: 34, height: 34, borderRadius: "50%", border: `2px solid ${medalColor(i)}`,
              display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'IBM Plex Mono', monospace",
              fontWeight: 700, fontSize: 13, color: medalColor(i), flexShrink: 0 }}>{i + 1}</div>
            {i < 3 ? <Medal size={18} color={medalColor(i)} /> : <UserIcon size={18} color={T.inkSoft} />}
            <div style={{ flex: 1, fontWeight: 600 }}>{row.name}</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: T.inkSoft }}>{row.date}</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 15, minWidth: 54, textAlign: "right" }}>{row.score}/{row.total}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
