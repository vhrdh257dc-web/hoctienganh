  { id: "passive", code: "04", title: "Câu bị động", subtitle: "Passive Voice",

  { id: "conditional", code: "05", title: "Câu điều kiện", subtitle: "Conditional Sentences",
    summary: "Diễn tả một sự việc phụ thuộc vào điều kiện: loại 0 (sự thật), loại 1 (có thể xảy ra), loại 2 (giả định hiện tại), loại 3 (giả định quá khứ, đã không xảy ra).",

  { id: "modals", code: "07", title: "Động từ khuyết thiếu", subtitle: "Modal Verbs",

  { id: "relative_clauses", code: "09", title: "Mệnh đề quan hệ", subtitle: "Relative Clauses",

/* Gộp từ vựng có sẵn với từ vựng do Admin thêm qua Firebase (form hoặc upload Excel).
   customVocab có dạng { pushKey: { category, en, vi, ex } } */
function mergeVocabCategories(customVocab) {
  const extra = Object.entries(customVocab || {});
  if (extra.length === 0) return VOCAB_CATEGORIES;
  return VOCAB_CATEGORIES.map((c) => {
    const added = extra.filter(([, w]) => w.category === c.id).map(([key, w]) => ({ en: w.en, vi: w.vi, ex: w.ex, customKey: key }));
    return added.length ? { ...c, words: [...c.words, ...added] } : c;
  });
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildVocabPool(vocabCategories) {
  const all = (vocabCategories || VOCAB_CATEGORIES).flatMap((c) => c.words.map((w) => ({ ...w, cat: c.id })));
  return all.map((w) => {
    const distractors = shuffle(all.filter((o) => o.vi !== w.vi)).slice(0, 3).map((o) => o.vi);
    const options = shuffle([w.vi, ...distractors]);
    return { type: "vocab", prompt: `Từ "${w.en}" có nghĩa là gì?`, options, correctAnswer: w.vi };
  });
}
function buildGrammarPool(readTopics, onlyTopicId, customQuestions) {
  const extra = Object.values(customQuestions || {});
  return [...GRAMMAR_QUIZ, ...extra]
    .filter((q) => (onlyTopicId ? q.topic === onlyTopicId : readTopics && readTopics[q.topic]))
    .map((q) => ({
      type: "grammar", prompt: q.prompt, options: shuffle(q.options), correctAnswer: q.options[q.correct], topic: q.topic,
    }));
}

}

/* ============================== SYNC CODE + ROOT ==============================
   Mỗi học viên (thực tế là mỗi NGƯỜI, không phải mỗi thiết bị) được định danh bằng
   một "mã đồng bộ" ngẫu nhiên, sinh ra một lần trên thiết bị đầu tiên và nhập lại
   trên các thiết bị khác. Cách này đáng tin cậy hơn nhiều so với gõ tên (dễ lệch
   chữ hoa/thường, dấu cách...) vì mã là duy nhất và không cần gõ lại nội dung.
================================================================================ */
function generateSyncCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // bỏ ký tự dễ nhầm: 0/O, 1/I/L
  let code = "";
  for (let i = 0; i < 8; i++) {
    if (i === 4) code += "-";
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}
function normalizeSyncCode(raw) {
  return raw.trim().toUpperCase().replace(/[^A-Z0-9-]/g, "");
}

function SyncGateView({ onReady }) {
  const [mode, setMode] = useState("choose"); // choose | createName | createDone | link | linkName
  const [name, setName] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [newCode, setNewCode] = useState("");
  const [linkError, setLinkError] = useState("");
  const [checking, setChecking] = useState(false);
  const [copied, setCopied] = useState(false);

  const finishCreate = () => {
    const code = generateSyncCode();
    setNewCode(code);
    db.ref(`users/${code}/name`).set(name.trim());
    setMode("createDone");
  };
  const finishLinkLookup = () => {
    const code = normalizeSyncCode(codeInput);
    if (!code) { setLinkError("Nhập mã đồng bộ trước đã."); return; }
    setChecking(true);
    setLinkError("");
    db.ref(`users/${code}/name`).once("value").then((snap) => {
      setChecking(false);
      const existingName = snap.val();
      if (existingName) {
        onReady(code, existingName);
      } else {
        setName("");
        setMode("linkName");
      }
    }).catch(() => { setChecking(false); setLinkError("Không kết nối được, thử lại nhé."); });
  };
  const finishLinkNew = () => {
    const code = normalizeSyncCode(codeInput);
    db.ref(`users/${code}/name`).set(name.trim());
    onReady(code, name.trim());
  };
  const copyCode = () => {
    navigator.clipboard?.writeText(newCode).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); });
  };

  const wrap = (children) => (
    <div style={{ minHeight: "100vh", background: T.bg, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ ...cardStyle({ padding: 28 }), maxWidth: 400, width: "100%" }}>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: T.primary, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 16 }}>
          <BookOpen size={20} color="#fff" />
        </div>
        {children}
      </div>
    </div>
  );

  if (mode === "choose") {
    return wrap(<>
      <h2 style={{ fontSize: 21, fontWeight: 800, margin: "0 0 6px" }}>Chào bạn 👋</h2>
      <p style={{ fontSize: 14, color: T.textSoft, lineHeight: 1.5, marginBottom: 20 }}>
        Đây là máy đầu tiên bạn học, hay bạn đang liên kết thêm một thiết bị (điện thoại, iPad...) để đồng bộ tiến độ đã có?
      </p>
      <button className="app-btn" onClick={() => setMode("createName")} style={{ ...primaryBtnStyle(), width: "100%", justifyContent: "center", marginBottom: 10 }}>
        Máy đầu tiên — bắt đầu mới <ChevronRight size={16} />
      </button>
      <button className="app-btn" onClick={() => { setMode("link"); setLinkError(""); }} style={{ ...ghostBtnStyle(), width: "100%", justifyContent: "center" }}>
        Tôi đã có mã đồng bộ
      </button>
    </>);
  }

  if (mode === "createName") {
    return wrap(<>
      <h2 style={{ fontSize: 21, fontWeight: 800, margin: "0 0 6px" }}>Tên hiển thị</h2>
      <p style={{ fontSize: 14, color: T.textSoft, lineHeight: 1.5, marginBottom: 18 }}>
        Dùng cho bảng xếp hạng. Sau bước này bạn sẽ nhận một mã đồng bộ để dùng trên các thiết bị khác.
      </p>
      <input value={name} onChange={(e) => setName(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter" && name.trim()) finishCreate(); }}
        placeholder="Ví dụ: Minh Anh" autoFocus
        style={{ width: "100%", padding: "11px 14px", borderRadius: 9, border: `1.5px solid ${T.border}`,
          fontFamily: "'Inter', sans-serif", fontSize: 14, marginBottom: 14, background: "#fff", color: T.text, boxSizing: "border-box" }} />
      <button className="app-btn" disabled={!name.trim()} onClick={finishCreate}
        style={{ ...primaryBtnStyle(), width: "100%", justifyContent: "center", opacity: name.trim() ? 1 : 0.5 }}>
        Tạo mã đồng bộ <ChevronRight size={16} />
      </button>
    </>);
  }

  if (mode === "createDone") {
    return wrap(<>
      <h2 style={{ fontSize: 21, fontWeight: 800, margin: "0 0 6px" }}>Mã đồng bộ của bạn</h2>
      <p style={{ fontSize: 14, color: T.textSoft, lineHeight: 1.5, marginBottom: 16 }}>
        Lưu lại mã này. Khi mở app trên iPhone hoặc iPad, chọn "Tôi đã có mã đồng bộ" và nhập đúng mã dưới đây — tiến độ học sẽ tự động khớp.
      </p>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
        background: T.primarySoft, color: T.primaryDeep, borderRadius: 10, padding: "14px 16px", marginBottom: 16 }}>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 20, letterSpacing: "0.04em" }}>{newCode}</span>
        <button onClick={copyCode} style={{ background: "none", border: "none", cursor: "pointer", color: T.primaryDeep, fontWeight: 600, fontSize: 12.5 }}>
          {copied ? "Đã sao chép" : "Sao chép"}
        </button>
      </div>
      <button className="app-btn" onClick={() => onReady(newCode, name.trim())}
        style={{ ...primaryBtnStyle(), width: "100%", justifyContent: "center" }}>
        Vào học <ChevronRight size={16} />
      </button>
    </>);
  }

  if (mode === "link") {
    return wrap(<>
      <h2 style={{ fontSize: 21, fontWeight: 800, margin: "0 0 6px" }}>Nhập mã đồng bộ</h2>
      <p style={{ fontSize: 14, color: T.textSoft, lineHeight: 1.5, marginBottom: 18 }}>
        Mã bạn đã lưu từ thiết bị đầu tiên, dạng <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>ABCD-1234</span>.
      </p>
      <input value={codeInput} onChange={(e) => setCodeInput(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter") finishLinkLookup(); }}
        placeholder="ABCD-1234" autoFocus
        style={{ width: "100%", padding: "11px 14px", borderRadius: 9, border: `1.5px solid ${linkError ? T.danger : T.border}`,
          fontFamily: "'IBM Plex Mono', monospace", fontSize: 16, letterSpacing: "0.04em", marginBottom: 10, background: "#fff", color: T.text, boxSizing: "border-box" }} />
      {linkError && <div style={{ color: T.danger, fontSize: 12.5, marginBottom: 10 }}>{linkError}</div>}
      <button className="app-btn" disabled={checking} onClick={finishLinkLookup}
        style={{ ...primaryBtnStyle(), width: "100%", justifyContent: "center", marginBottom: 10, opacity: checking ? 0.6 : 1 }}>
        {checking ? "Đang kiểm tra..." : "Liên kết thiết bị"}
      </button>
      <button className="app-btn" onClick={() => setMode("choose")} style={{ ...ghostBtnStyle(), width: "100%", justifyContent: "center" }}>
        Quay lại
      </button>
    </>);
  }

  if (mode === "linkName") {
    return wrap(<>
      <h2 style={{ fontSize: 21, fontWeight: 800, margin: "0 0 6px" }}>Mã mới, chưa có tên</h2>
      <p style={{ fontSize: 14, color: T.textSoft, lineHeight: 1.5, marginBottom: 18 }}>
        Không tìm thấy dữ liệu cũ cho mã này — có thể đây là mã bạn tự đặt. Đặt tên hiển thị để tiếp tục.
      </p>
      <input value={name} onChange={(e) => setName(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter" && name.trim()) finishLinkNew(); }}
        placeholder="Ví dụ: Minh Anh" autoFocus
        style={{ width: "100%", padding: "11px 14px", borderRadius: 9, border: `1.5px solid ${T.border}`,
          fontFamily: "'Inter', sans-serif", fontSize: 14, marginBottom: 14, background: "#fff", color: T.text, boxSizing: "border-box" }} />
      <button className="app-btn" disabled={!name.trim()} onClick={finishLinkNew}
        style={{ ...primaryBtnStyle(), width: "100%", justifyContent: "center", opacity: name.trim() ? 1 : 0.5 }}>
        Vào học <ChevronRight size={16} />
      </button>
    </>);
  }

  return null;
}

function RootApp() {
  const [syncCode, setSyncCode] = useState(() => localStorage.getItem("toeic_sync_code") || "");
  const [studentName, setStudentName] = useState(() => localStorage.getItem("toeic_student_name") || "");

  if (!syncCode) {
    return (
      <SyncGateView onReady={(code, name) => {
        localStorage.setItem("toeic_sync_code", code);
        localStorage.setItem("toeic_student_name", name);
        setSyncCode(code);
        setStudentName(name);
      }} />
    );
  }
  return <StudyApp studentKey={syncCode} studentName={studentName} onSwitchUser={() => {
    localStorage.removeItem("toeic_sync_code");
    localStorage.removeItem("toeic_student_name");
    setSyncCode("");
    setStudentName("");
  }} />;
}

/* ============================== MAIN APP ============================== */
function StudyApp({ studentKey, studentName, onSwitchUser }) {
  const isAdminUser = studentName.trim().toLowerCase() === "admin";
  const [dataLoaded, setDataLoaded] = useState(false);
  const saveTimer = useRef(null);

  const [view, setView] = useState(isAdminUser ? "admin" : "home");
  const [selectedTopic, setSelectedTopic] = useState(null);
  const [catIndex, setCatIndex] = useState(0);
  const [deckOrder, setDeckOrder] = useState(null); // shuffled index array or null = in-order
  const [cardPos, setCardPos] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [knownWords, setKnownWords] = useState({});
  const [learningWords, setLearningWords] = useState({});
  const [readTopics, setReadTopics] = useState({});

  const [quizStage, setQuizStage] = useState("setup");
  const [quizFilter, setQuizFilter] = useState("all");
  const [quizCount, setQuizCount] = useState(10);
  const [quizQuestions, setQuizQuestions] = useState([]);
  const [quizIndex, setQuizIndex] = useState(0);
  const [quizAnswers, setQuizAnswers] = useState([]);
  const [selectedOption, setSelectedOption] = useState(null);

  const [leaderboard, setLeaderboard] = useState([]);
  const [playerName, setPlayerName] = useState(studentName || "");
  const [nameSaved, setNameSaved] = useState(false);
  const [bestScore, setBestScore] = useState(null);

  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [customQuestions, setCustomQuestions] = useState({});
  const [customVocab, setCustomVocab] = useState({});

  const totalWordsSeen = Object.keys(knownWords).length;

  /* ---- Load this student's progress from Firebase on mount ---- */
  useEffect(() => {
    db.ref(`users/${studentKey}`).once("value")
      .then((snap) => {
        const val = snap.val();
        if (val) {
          if (val.knownWords) setKnownWords(val.knownWords);
          if (val.learningWords) setLearningWords(val.learningWords);
          if (val.readTopics) setReadTopics(val.readTopics);
          if (typeof val.bestScore === "number") setBestScore(val.bestScore);
        }
        setDataLoaded(true);
      })
      .catch(() => setDataLoaded(true));
  }, [studentKey]);

  /* ---- Save this student's progress to Firebase (debounced) ---- */
  useEffect(() => {
    if (!dataLoaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      db.ref(`users/${studentKey}`).set({ knownWords, learningWords, readTopics, bestScore: bestScore ?? null, name: studentName });
    }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [knownWords, learningWords, readTopics, bestScore, dataLoaded, studentKey, studentName]);

  /* ---- Load + subscribe to shared leaderboard ---- */
  useEffect(() => {
    const ref = db.ref("leaderboard");
    const listener = ref.limitToLast(20).on("value", (snap) => {
      const val = snap.val();
      if (val) {
        const rows = Object.values(val).sort((a, b) => b.score / b.total - a.score / a.total).slice(0, 8);
        setLeaderboard(rows);
      }
    });
    return () => ref.off("value", listener);
  }, []);

  /* ---- Load + subscribe to shared custom questions (added via Admin) ---- */
  useEffect(() => {
    const ref = db.ref("content/customGrammarQuestions");
    const listener = ref.on("value", (snap) => setCustomQuestions(snap.val() || {}));
    return () => ref.off("value", listener);
  }, []);

  /* ---- Load + subscribe to shared custom vocabulary (added via Admin) ---- */
  useEffect(() => {
    const ref = db.ref("content/customVocab");
    const listener = ref.on("value", (snap) => setCustomVocab(snap.val() || {}));
    return () => ref.off("value", listener);
  }, []);

  /* ---- Merge built-in vocab categories with custom words added via Admin ---- */
  const vocabCategories = useMemo(() => mergeVocabCategories(customVocab), [customVocab]);

  const goto = (v) => { window.scrollTo({ top: 0, behavior: "smooth" }); setView(v); };
  const openTopic = (topic) => {
    setSelectedTopic(topic);
    setReadTopics((prev) => (prev[topic.id] ? prev : { ...prev, [topic.id]: true }));
    goto("grammarDetail");
  };
  const readTopicCount = Object.keys(readTopics).length;
  const hasReadAnyTopic = readTopicCount > 0;
  const openCategory = (idx) => { setCatIndex(idx); setCardPos(0); setDeckOrder(null); setFlipped(false); goto("vocabDeck"); };

  const markKnown = (id) => { setKnownWords((prev) => ({ ...prev, [id]: true })); setLearningWords((prev) => { const n = { ...prev }; delete n[id]; return n; }); };
  const markLearning = (id) => { setLearningWords((prev) => ({ ...prev, [id]: true })); setKnownWords((prev) => { const n = { ...prev }; delete n[id]; return n; }); };

  const currentDeckIndices = (cat) => deckOrder || cat.words.map((_, i) => i);
  const nextCard = () => { setFlipped(false); const cat = vocabCategories[catIndex]; setCardPos((i) => (i + 1) % cat.words.length); };
  const prevCard = () => { setFlipped(false); const cat = vocabCategories[catIndex]; setCardPos((i) => (i - 1 + cat.words.length) % cat.words.length); };
  const toggleShuffleDeck = () => {
    const cat = vocabCategories[catIndex];
    if (deckOrder) { setDeckOrder(null); setCardPos(0); }
    else { setDeckOrder(shuffle(cat.words.map((_, i) => i))); setCardPos(0); }
    setFlipped(false);
  };

  const isSingleTopicFilter = GRAMMAR_TOPICS.some((t) => t.id === quizFilter);
  const startQuiz = () => {
    if (quizFilter !== "vocab" && !isSingleTopicFilter && !hasReadAnyTopic) return; // khoá: chưa đọc lý thuyết nào
    let pool = [];
    if (isSingleTopicFilter) pool = buildGrammarPool(readTopics, quizFilter, customQuestions);
    else if (quizFilter === "all") pool = [...buildVocabPool(vocabCategories), ...buildGrammarPool(readTopics, null, customQuestions)];
    else if (quizFilter === "vocab") pool = buildVocabPool(vocabCategories);
    else pool = buildGrammarPool(readTopics, null, customQuestions);
    if (pool.length === 0) return;
    const picked = shuffle(pool).slice(0, Math.min(quizCount, pool.length));
    setQuizQuestions(picked); setQuizIndex(0); setQuizAnswers([]); setSelectedOption(null); setQuizStage("active");
  };
  const answerQuiz = (opt) => {
    if (selectedOption !== null) return;
    setSelectedOption(opt);
    const q = quizQuestions[quizIndex];
    const correct = opt === q.correctAnswer;
    setQuizAnswers((prev) => [...prev, { ...q, chosen: opt, correct }]);
  };
  const nextQuestion = () => {
    if (quizIndex + 1 >= quizQuestions.length) setQuizStage("result");
    else { setQuizIndex((i) => i + 1); setSelectedOption(null); }
  };
  const finalScore = quizAnswers.filter((a) => a.correct).length;
  const saveScore = () => {
    const name = (playerName.trim() || studentName || "Bạn");
    const entry = { name, score: finalScore, total: quizQuestions.length, date: todayStr() };
    db.ref("leaderboard").push(entry);
    setBestScore((prev) => (prev === null ? finalScore : Math.max(prev, finalScore)));
    setNameSaved(true);
  };
  const resetQuiz = () => { setQuizStage("setup"); setQuizIndex(0); setQuizAnswers([]); setSelectedOption(null); setNameSaved(false); };

  const cat = vocabCategories[catIndex];
  const orderedIdx = currentDeckIndices(cat);
  const word = cat.words[orderedIdx[cardPos]];

  return (
    <div style={{ minHeight: "100vh", background: T.bg, fontFamily: "'Inter', sans-serif", color: T.text }}>
      <header style={{ borderBottom: `1px solid ${T.border}`, position: "sticky", top: 0, zIndex: 20, background: "rgba(248,250,252,0.92)", backdropFilter: "blur(6px)" }}>
        <div style={{ maxWidth: 1040, margin: "0 auto", padding: "16px 24px" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: "8px 14px", marginBottom: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }} onClick={() => goto("home")}>
              <div style={{ width: 30, height: 30, borderRadius: 8, background: T.primary, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <BookOpen size={16} color="#fff" />
              </div>
              <span style={{ fontWeight: 800, fontSize: 18, letterSpacing: "-0.01em", whiteSpace: "nowrap" }}>Study</span>
            </div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, color: T.textSoft, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
              <span>TỪ ĐÃ THUỘC: {totalWordsSeen}</span>
              <span>ĐIỂM CAO: {bestScore ?? "—"}</span>
              <span title="Mã đồng bộ — nhập mã này trên thiết bị khác để đồng bộ tiến độ" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: T.textSoft, letterSpacing: "0.02em" }}>
                {studentKey}
              </span>
              <button onClick={onSwitchUser} title="Đổi người dùng / thiết bị" style={{ display: "flex", alignItems: "center", gap: 4, background: T.primarySoft, color: T.primaryDeep, border: "none", borderRadius: 999, padding: "4px 10px", cursor: "pointer", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, fontWeight: 600 }}>
                <UserIcon size={12} /> {studentName}
              </button>
            </div>
          </div>
          <nav className="tab-scroll" style={{ display: "flex", gap: 4, overflowX: "auto" }}>
            <NavTab active={view === "home"} onClick={() => goto("home")} icon={Home} label="Trang chủ" />
            <NavTab active={view === "overview"} onClick={() => goto("overview")} icon={Info} label="Giới thiệu TOEIC" />
            <NavTab active={view === "grammar" || view === "grammarDetail"} onClick={() => goto("grammar")} icon={BookOpen} label="Ngữ pháp" />
            <NavTab active={view === "vocab" || view === "vocabDeck"} onClick={() => goto("vocab")} icon={Layers} label="Từ vựng" />
            <NavTab active={view === "quiz"} onClick={() => { resetQuiz(); goto("quiz"); }} icon={Target} label="Luyện tập" />
            <NavTab active={view === "leaderboard"} onClick={() => goto("leaderboard")} icon={Trophy} label="Xếp hạng" />
          </nav>
        </div>
      </header>

      <main style={{ maxWidth: 1040, margin: "0 auto", padding: "32px 24px 72px" }}>
        {view === "home" && <HomeView goto={goto} totalWordsSeen={totalWordsSeen} bestScore={bestScore} openTopic={openTopic} vocabCount={vocabCategories.length} />}
        {view === "overview" && <OverviewView />}
        {view === "grammar" && <GrammarListView onOpen={openTopic} readTopics={readTopics} />}
        {view === "grammarDetail" && selectedTopic && (
          <GrammarDetailView topic={selectedTopic} onBack={() => goto("grammar")} onQuiz={() => { resetQuiz(); setQuizFilter(selectedTopic.id); goto("quiz"); }} />
        )}
        {view === "vocab" && <VocabHubView onOpen={openCategory} knownWords={knownWords} vocabCategories={vocabCategories} />}
        {view === "vocabDeck" && (
          <VocabDeckView category={cat} word={word} cardPos={cardPos} flipped={flipped} setFlipped={setFlipped}
            onNext={nextCard} onPrev={prevCard} onBack={() => goto("vocab")} markKnown={markKnown} markLearning={markLearning}
            knownWords={knownWords} learningWords={learningWords} isShuffled={!!deckOrder} onToggleShuffle={toggleShuffleDeck} />
        )}
        {view === "quiz" && quizStage === "setup" && (

function QuizActiveView({ question, index, total, selectedOption, onAnswer, onNext }) {
  const progress = (index / total) * 100;
  return (
    <div style={{ maxWidth: 540, margin: "0 auto" }}>
      <div style={{ height: 6, background: T.border, borderRadius: 999, overflow: "hidden", marginBottom: 18 }}>
        <div className="progress-fill" style={{ height: "100%", width: `${progress}%`, background: T.primary }} />
      </div>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, color: T.textSoft, marginBottom: 10 }}>Câu {index + 1} / {total}</div>
      <div style={cardStyle({ padding: "24px 22px", marginBottom: 18 })}>
        <div style={{ fontSize: 19, fontWeight: 700, lineHeight: 1.4 }}>{question.prompt}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 9, marginBottom: 20 }}>
        {question.options.map((opt, i) => {
          const isSelected = selectedOption === opt;
          const isCorrect = opt === question.correctAnswer;
          let bg = "#fff", border = T.border;
          if (selectedOption !== null) {
            if (isCorrect) { bg = T.successSoft; border = T.success; }
            else if (isSelected && !isCorrect) { bg = T.dangerSoft; border = T.danger; }
          }
          return (
            <button key={i} className="quiz-opt app-btn" disabled={selectedOption !== null} onClick={() => onAnswer(opt)}
              style={{ textAlign: "left", padding: "13px 16px", borderRadius: 10, border: `1.5px solid ${border}`,
                background: bg, color: T.text, fontSize: 15, cursor: selectedOption !== null ? "default" : "pointer",
                display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              {opt}
              {selectedOption !== null && isCorrect && <Check size={17} color={T.success} />}
              {selectedOption !== null && isSelected && !isCorrect && <XIcon size={17} color={T.danger} />}
            </button>
          );
        })}
      </div>
      {selectedOption !== null && (
        <button className="app-btn" onClick={onNext} style={{ ...primaryBtnStyle(), width: "100%", justifyContent: "center" }}>
          {index + 1 >= total ? "Xem kết quả" : "Câu tiếp theo"} <ChevronRight size={16} />
        </button>
      )}
    </div>
  );
}

function AdminView({ unlocked, onUnlock, customQuestions, customVocab }) {
  const [pwInput, setPwInput] = useState("");
  const [pwError, setPwError] = useState(false);
  const [tab, setTab] = useState("grammar"); // grammar | vocab
  const [form, setForm] = useState({ topic: GRAMMAR_TOPICS[0].id, prompt: "", opt0: "", opt1: "", opt2: "", opt3: "", correct: 0 });
  const [saving, setSaving] = useState(false);
  const [saveMsg, setSaveMsg] = useState("");

  const [uploadStatus, setUploadStatus] = useState("idle"); // idle | reading | done | error
  const [uploadResult, setUploadResult] = useState(null); // { added, skipped: [{row, reason}] }
  const [uploadFileName, setUploadFileName] = useState("");

  const [vocabForm, setVocabForm] = useState({ category: VOCAB_CATEGORIES[0].id, en: "", vi: "", ex: "" });
  const [vocabSaving, setVocabSaving] = useState(false);
  const [vocabSaveMsg, setVocabSaveMsg] = useState("");
  const [vocabUploadStatus, setVocabUploadStatus] = useState("idle");
  const [vocabUploadResult, setVocabUploadResult] = useState(null);
  const [vocabUploadFileName, setVocabUploadFileName] = useState("");

  const handleBulkFile = (file) => {
    if (!file) return;
    setUploadFileName(file.name);
    setUploadStatus("reading");
    setUploadResult(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const dataRows = rows.slice(2); // skip header row + example row

        const updates = {};
        const skipped = [];
        let added = 0;

        dataRows.forEach((row, i) => {
          const rowNum = i + 3;
          const [topicTitle, prompt, a, b, c, d, correctLetter] = row.map((v) => String(v ?? "").trim());
          if (!prompt && !topicTitle) return;

          if (!prompt || !a || !b || !c || !d || !correctLetter) {
            skipped.push({ row: rowNum, reason: "Thiếu thông tin (câu hỏi/đáp án/đáp án đúng)" });
            return;
          }
          const topicId = TOPIC_TITLE_TO_ID[topicTitle] || null;
          if (!topicId) {
            skipped.push({ row: rowNum, reason: `Chủ điểm "${topicTitle}" không khớp danh sách có sẵn` });
            return;
          }
          const letterIdx = { A: 0, B: 1, C: 2, D: 3 }[correctLetter.toUpperCase()];
          if (letterIdx === undefined) {
            skipped.push({ row: rowNum, reason: `Đáp án đúng "${correctLetter}" không hợp lệ (cần A/B/C/D)` });
            return;
          }

          const key = db.ref("content/customGrammarQuestions").push().key;
          updates[key] = { topic: topicId, prompt, options: [a, b, c, d], correct: letterIdx };
          added++;
        });

        if (added > 0) {
          db.ref("content/customGrammarQuestions").update(updates).then(() => {
            setUploadStatus("done");
            setUploadResult({ added, skipped });
          }).catch(() => setUploadStatus("error"));
        } else {
          setUploadStatus("done");
          setUploadResult({ added: 0, skipped });
        }
      } catch (err) {
        setUploadStatus("error");
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const handleVocabBulkFile = (file) => {
    if (!file) return;
    setVocabUploadFileName(file.name);
    setVocabUploadStatus("reading");
    setVocabUploadResult(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const dataRows = rows.slice(2); // bỏ dòng tiêu đề + dòng ví dụ

        const updates = {};
        const skipped = [];
        let added = 0;

        dataRows.forEach((row, i) => {
          const rowNum = i + 3;
          const [categoryTitle, en, vi, ex] = row.map((v) => String(v ?? "").trim());
          if (!en && !categoryTitle) return;

          if (!categoryTitle || !en || !vi) {
            skipped.push({ row: rowNum, reason: "Thiếu thông tin (chủ đề/từ tiếng Anh/nghĩa tiếng Việt)" });
            return;
          }
          const categoryId = VOCAB_CATEGORY_TITLE_TO_ID[categoryTitle] || null;
          if (!categoryId) {
            skipped.push({ row: rowNum, reason: `Chủ đề "${categoryTitle}" không khớp danh sách có sẵn` });
            return;
          }
          const key = db.ref("content/customVocab").push().key;
          updates[key] = { category: categoryId, en, vi, ex: ex || "" };
          added++;
        });

        if (added > 0) {
          db.ref("content/customVocab").update(updates).then(() => {
            setVocabUploadStatus("done");
            setVocabUploadResult({ added, skipped });
          }).catch(() => setVocabUploadStatus("error"));
        } else {
          setVocabUploadStatus("done");
          setVocabUploadResult({ added: 0, skipped });
        }
      } catch (err) {
        setVocabUploadStatus("error");
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const submitVocabWord = async () => {
    if (!vocabForm.en.trim() || !vocabForm.vi.trim()) {
      setVocabSaveMsg("Điền đầy đủ từ tiếng Anh và nghĩa tiếng Việt trước khi lưu.");

    }
    setVocabSaving(true);
    try {
      await db.ref("content/customVocab").push({

      });
      setVocabForm({ category: vocabForm.category, en: "", vi: "", ex: "" });
      setVocabSaveMsg("Đã thêm từ mới!");

  };

    else setPwError(true);

  const submitQuestion = async () => {

                {GRAMMAR_TOPICS.map((t) => <option key={t.id} value={t.id}>{t.title} ({t.subtitle})</option>)}
              </select>
            </div>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: T.textSoft, marginBottom: 6 }}>Câu hỏi</div>
              <textarea value={form.prompt} onChange={(e) => setForm({ ...form, prompt: e.target.value })} rows={2}
                placeholder="Ví dụ: She ___ to the office every day."
                style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: `1.5px solid ${T.border}`, fontSize: 14, fontFamily: "inherit", boxSizing: "border-box", resize: "vertical" }} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: T.textSoft, marginBottom: 6 }}>4 đáp án (chọn nút tròn cho đáp án đúng)</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {[0, 1, 2, 3].map((i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <input type="radio" name="correctOpt" checked={form.correct === i} onChange={() => setForm({ ...form, correct: i })} />
                    <input type="text" value={form[`opt${i}`]} onChange={(e) => setForm({ ...form, [`opt${i}`]: e.target.value })}
                      placeholder={`Đáp án ${i + 1}`}
                      style={{ flex: 1, padding: "8px 10px", borderRadius: 8, border: `1.5px solid ${T.border}`, fontSize: 13.5, boxSizing: "border-box" }} />
                  </div>
                ))}
              </div>
            </div>
            <button className="app-btn" onClick={submitQuestion} disabled={saving}
              style={{ ...primaryBtnStyle(), justifyContent: "center", opacity: saving ? 0.6 : 1 }}>
              <Plus size={16} /> {saving ? "Đang lưu..." : "Thêm câu hỏi"}
            </button>
            {saveMsg && <div style={{ marginTop: 10, fontSize: 13, color: saveMsg.includes("lỗi") || saveMsg.includes("Điền") ? T.danger : T.success }}>{saveMsg}</div>}
          </div>

          <SectionEyebrow>Câu hỏi đã thêm ({customList.length})</SectionEyebrow>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
            {customList.length === 0 && <div style={{ color: T.textSoft, fontSize: 13.5 }}>Chưa có câu hỏi tuỳ chỉnh nào.</div>}
            {customList.map(([key, q]) => {
              const topicTitle = GRAMMAR_TOPICS.find((t) => t.id === q.topic)?.title || q.topic;
              return (
                <div key={key} style={cardStyle({ padding: "14px 16px", maxWidth: 560, display: "flex", justifyContent: "space-between", gap: 10 })}>
                  <div>
                    <Badge tone="neutral">{topicTitle}</Badge>
                    <div style={{ fontWeight: 600, fontSize: 14, margin: "8px 0 4px" }}>{q.prompt}</div>
                    <div style={{ fontSize: 12.5, color: T.textSoft }}>
                      Đáp án đúng: <strong style={{ color: T.success }}>{q.options[q.correct]}</strong>
                    </div>
                  </div>
                  <button onClick={() => deleteQuestion(key)} title="Xoá"
                    style={{ background: "none", border: "none", cursor: "pointer", color: T.danger, flexShrink: 0, height: "fit-content" }}>
                    <Trash size={17} />
                  </button>
                </div>
              );
            })}
          </div>
        </>
      )}

      {tab === "vocab" && (
        <>
          <div style={cardStyle({ padding: 24, maxWidth: 560, marginBottom: 28 })}>
            <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 4 }}>Tải từ vựng lên hàng loạt từ file Excel</div>
            <div style={{ fontSize: 13, color: T.textSoft, marginBottom: 14, lineHeight: 1.5 }}>
              Soạn nhiều từ theo file mẫu (chủ đề, từ tiếng Anh, nghĩa tiếng Việt, câu ví dụ), rồi tải file lên đây một lần — cách nhanh nhất để cập nhật từ vựng thường xuyên từ bất kỳ thiết bị nào.
            </div>
            <label htmlFor="bulkVocabFileInput" style={{
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8,
              border: `2px dashed ${T.border}`, borderRadius: 10, padding: "24px 16px", cursor: "pointer", textAlign: "center",
            }}>
              <Upload size={22} color={T.primary} />
              <div style={{ fontWeight: 600, fontSize: 14 }}>Bấm để chọn file Excel (.xlsx)</div>
              <div style={{ fontSize: 12.5, color: T.textSoft }}>{vocabUploadFileName || "Chưa chọn file nào"}</div>
            </label>
            <input id="bulkVocabFileInput" type="file" accept=".xlsx,.xls" style={{ display: "none" }}
              onChange={(e) => handleVocabBulkFile(e.target.files[0])} />

            {vocabUploadStatus === "reading" && <div style={{ marginTop: 12, fontSize: 13, color: T.textSoft }}>Đang đọc file…</div>}
            {vocabUploadStatus === "error" && <div style={{ marginTop: 12, fontSize: 13, color: T.danger }}>Không đọc được file. Kiểm tra đúng định dạng .xlsx và đúng cấu trúc mẫu.</div>}
            {vocabUploadStatus === "done" && vocabUploadResult && (
              <div style={{ marginTop: 14 }}>
                <div style={{ fontWeight: 700, fontSize: 13.5, color: vocabUploadResult.added > 0 ? T.success : T.danger, marginBottom: 8 }}>
                  {vocabUploadResult.added > 0 ? `✓ Đã thêm ${vocabUploadResult.added} từ mới` : "Không có từ nào được thêm"}
                </div>
                {vocabUploadResult.skipped.length > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {vocabUploadResult.skipped.map((s, i) => (
                      <div key={i} style={{ fontSize: 12.5, color: T.textSoft }}>
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>Dòng {s.row}:</span> {s.reason}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          <div style={cardStyle({ padding: 24, maxWidth: 560, marginBottom: 28 })}>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: T.textSoft, marginBottom: 6 }}>Chủ đề</div>
              <select value={vocabForm.category} onChange={(e) => setVocabForm({ ...vocabForm, category: e.target.value })}
                style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: `1.5px solid ${T.border}`, fontSize: 14, boxSizing: "border-box" }}>
                {VOCAB_CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: T.textSoft, marginBottom: 6 }}>Từ tiếng Anh</div>
              <input type="text" value={vocabForm.en} onChange={(e) => setVocabForm({ ...vocabForm, en: e.target.value })}
                placeholder="Ví dụ: invoice"
                style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: `1.5px solid ${T.border}`, fontSize: 14, boxSizing: "border-box" }} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: T.textSoft, marginBottom: 6 }}>Nghĩa tiếng Việt</div>
              <input type="text" value={vocabForm.vi} onChange={(e) => setVocabForm({ ...vocabForm, vi: e.target.value })}
                placeholder="Ví dụ: hóa đơn"
                style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: `1.5px solid ${T.border}`, fontSize: 14, boxSizing: "border-box" }} />
            </div>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: T.textSoft, marginBottom: 6 }}>Câu ví dụ (không bắt buộc)</div>
              <input type="text" value={vocabForm.ex} onChange={(e) => setVocabForm({ ...vocabForm, ex: e.target.value })}
                placeholder="Ví dụ: Please send the invoice by Friday."
                style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: `1.5px solid ${T.border}`, fontSize: 14, boxSizing: "border-box" }} />
            </div>
            <button className="app-btn" onClick={submitVocabWord} disabled={vocabSaving}
              style={{ ...primaryBtnStyle(), justifyContent: "center", opacity: vocabSaving ? 0.6 : 1 }}>
              <Plus size={16} /> {vocabSaving ? "Đang lưu..." : "Thêm từ"}
            </button>
            {vocabSaveMsg && <div style={{ marginTop: 10, fontSize: 13, color: vocabSaveMsg.includes("lỗi") || vocabSaveMsg.includes("Điền") ? T.danger : T.success }}>{vocabSaveMsg}</div>}
          </div>

          <SectionEyebrow>Từ đã thêm ({customVocabList.length})</SectionEyebrow>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
            {customVocabList.length === 0 && <div style={{ color: T.textSoft, fontSize: 13.5 }}>Chưa có từ tuỳ chỉnh nào.</div>}
            {customVocabList.map(([key, w]) => {
              const categoryName = VOCAB_CATEGORIES.find((c) => c.id === w.category)?.name || w.category;
              return (
                <div key={key} style={cardStyle({ padding: "14px 16px", maxWidth: 560, display: "flex", justifyContent: "space-between", gap: 10 })}>
                  <div>
                    <Badge tone="neutral">{categoryName}</Badge>
                    <div style={{ fontWeight: 600, fontSize: 14, margin: "8px 0 4px" }}>{w.en} — {w.vi}</div>
                    {w.ex && <div style={{ fontSize: 12.5, color: T.textSoft, fontStyle: "italic" }}>"{w.ex}"</div>}
                  </div>
                  <button onClick={() => deleteVocabWord(key)} title="Xoá"
                    style={{ background: "none", border: "none", cursor: "pointer", color: T.danger, flexShrink: 0, height: "fit-content" }}>
                    <Trash size={17} />
                  </button>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<RootApp />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
