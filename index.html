function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

    type: "grammar", prompt: q.prompt, options: q.options, correctAnswer: q.options[q.correct], topic: q.topic,
  }));
}
function todayStr() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
}

/* ============================== MAIN APP ============================== */
function StudyApp({ studentName, onSwitchUser }) {
  const studentKey = useMemo(() => sanitizeKey(studentName), [studentName]);
  const [dataLoaded, setDataLoaded] = useState(false);
  const saveTimer = useRef(null);

  const [view, setView] = useState("home");
  const [selectedTopic, setSelectedTopic] = useState(null);
  const [catIndex, setCatIndex] = useState(0);
  const [deckOrder, setDeckOrder] = useState(null); // shuffled index array or null = in-order
  const [cardPos, setCardPos] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [knownWords, setKnownWords] = useState({});
  const [learningWords, setLearningWords] = useState({});

  const [quizStage, setQuizStage] = useState("setup");
  const [quizFilter, setQuizFilter] = useState("all");
  const [quizCount, setQuizCount] = useState(10);
  const [quizQuestions, setQuizQuestions] = useState([]);
  const [quizIndex, setQuizIndex] = useState(0);
  const [quizAnswers, setQuizAnswers] = useState([]);
  const [selectedOption, setSelectedOption] = useState(null);

  const [leaderboard, setLeaderboard] = useState([]);
  const [playerName, setPlayerName] = useState(studentName || "");
  const [nameSaved, setNameSaved] = useState(false);
  const [bestScore, setBestScore] = useState(null);

  const totalWordsSeen = Object.keys(knownWords).length;

  /* ---- Load this student's progress from Firebase on mount ---- */
  useEffect(() => {
    db.ref(`users/${studentKey}`).once("value")
      .then((snap) => {
        const val = snap.val();
        if (val) {
          if (val.knownWords) setKnownWords(val.knownWords);
          if (val.learningWords) setLearningWords(val.learningWords);
          if (typeof val.bestScore === "number") setBestScore(val.bestScore);
        }
        setDataLoaded(true);
      })
      .catch(() => setDataLoaded(true));
  }, [studentKey]);

  /* ---- Save this student's progress to Firebase (debounced) ---- */
  useEffect(() => {
    if (!dataLoaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      db.ref(`users/${studentKey}`).set({ knownWords, learningWords, bestScore: bestScore ?? null, name: studentName });
    }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [knownWords, learningWords, bestScore, dataLoaded, studentKey, studentName]);

  /* ---- Load + subscribe to shared leaderboard ---- */
  useEffect(() => {
    const ref = db.ref("leaderboard");
    const listener = ref.limitToLast(20).on("value", (snap) => {
      const val = snap.val();
      if (val) {
        const rows = Object.values(val).sort((a, b) => b.score / b.total - a.score / a.total).slice(0, 8);
        setLeaderboard(rows);
      }
    });
    return () => ref.off("value", listener);
  }, []);

  const goto = (v) => { window.scrollTo({ top: 0, behavior: "smooth" }); setView(v); };
  const openTopic = (topic) => { setSelectedTopic(topic); goto("grammarDetail"); };
  const openCategory = (idx) => { setCatIndex(idx); setCardPos(0); setDeckOrder(null); setFlipped(false); goto("vocabDeck"); };

  const markKnown = (id) => { setKnownWords((prev) => ({ ...prev, [id]: true })); setLearningWords((prev) => { const n = { ...prev }; delete n[id]; return n; }); };
  const markLearning = (id) => { setLearningWords((prev) => ({ ...prev, [id]: true })); setKnownWords((prev) => { const n = { ...prev }; delete n[id]; return n; }); };

  const currentDeckIndices = (cat) => deckOrder || cat.words.map((_, i) => i);
  const nextCard = () => { setFlipped(false); const cat = VOCAB_CATEGORIES[catIndex]; setCardPos((i) => (i + 1) % cat.words.length); };
  const prevCard = () => { setFlipped(false); const cat = VOCAB_CATEGORIES[catIndex]; setCardPos((i) => (i - 1 + cat.words.length) % cat.words.length); };
  const toggleShuffleDeck = () => {
    const cat = VOCAB_CATEGORIES[catIndex];
    if (deckOrder) { setDeckOrder(null); setCardPos(0); }
    else { setDeckOrder(shuffle(cat.words.map((_, i) => i))); setCardPos(0); }
    setFlipped(false);
  };

  const startQuiz = () => {
    let pool = [];
    if (quizFilter === "all") pool = [...buildVocabPool(), ...buildGrammarPool()];
    else if (quizFilter === "vocab") pool = buildVocabPool();
    else pool = buildGrammarPool();
    const picked = shuffle(pool).slice(0, Math.min(quizCount, pool.length));
    setQuizQuestions(picked); setQuizIndex(0); setQuizAnswers([]); setSelectedOption(null); setQuizStage("active");
  };
  const answerQuiz = (opt) => {
    if (selectedOption !== null) return;
    setSelectedOption(opt);
    const q = quizQuestions[quizIndex];
    const correct = opt === q.correctAnswer;
    setQuizAnswers((prev) => [...prev, { ...q, chosen: opt, correct }]);
  };
  const nextQuestion = () => {
    if (quizIndex + 1 >= quizQuestions.length) setQuizStage("result");
    else { setQuizIndex((i) => i + 1); setSelectedOption(null); }
  };
  const finalScore = quizAnswers.filter((a) => a.correct).length;
  const saveScore = () => {
    const name = (playerName.trim() || studentName || "Bạn");
    const entry = { name, score: finalScore, total: quizQuestions.length, date: todayStr() };
    db.ref("leaderboard").push(entry);
    setBestScore((prev) => (prev === null ? finalScore : Math.max(prev, finalScore)));
    setNameSaved(true);
  };
  const resetQuiz = () => { setQuizStage("setup"); setQuizIndex(0); setQuizAnswers([]); setSelectedOption(null); setNameSaved(false); };

  const cat = VOCAB_CATEGORIES[catIndex];
  const orderedIdx = currentDeckIndices(cat);
  const word = cat.words[orderedIdx[cardPos]];

  return (
    <div style={{ minHeight: "100vh", background: T.bg, fontFamily: "'Inter', sans-serif", color: T.text }}>
      <header style={{ borderBottom: `1px solid ${T.border}`, position: "sticky", top: 0, zIndex: 20, background: "rgba(248,250,252,0.92)", backdropFilter: "blur(6px)" }}>
        <div style={{ maxWidth: 1040, margin: "0 auto", padding: "16px 24px" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: "8px 14px", marginBottom: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }} onClick={() => goto("home")}>
              <div style={{ width: 30, height: 30, borderRadius: 8, background: T.primary, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <BookOpen size={16} color="#fff" />
              </div>
              <span style={{ fontWeight: 800, fontSize: 18, letterSpacing: "-0.01em", whiteSpace: "nowrap" }}>Study</span>
            </div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, color: T.textSoft, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
              <span>TỪ ĐÃ THUỘC: {totalWordsSeen}</span>
              <span>ĐIỂM CAO: {bestScore ?? "—"}</span>
              <button onClick={onSwitchUser} title="Đổi người dùng" style={{ display: "flex", alignItems: "center", gap: 4, background: T.primarySoft, color: T.primaryDeep, border: "none", borderRadius: 999, padding: "4px 10px", cursor: "pointer", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, fontWeight: 600 }}>
                <UserIcon size={12} /> {studentName}
              </button>
            </div>
          </div>
          <nav className="tab-scroll" style={{ display: "flex", gap: 4, overflowX: "auto" }}>
            <NavTab active={view === "home"} onClick={() => goto("home")} icon={Home} label="Trang chủ" />
            <NavTab active={view === "overview"} onClick={() => goto("overview")} icon={Info} label="Giới thiệu TOEIC" />
            <NavTab active={view === "grammar" || view === "grammarDetail"} onClick={() => goto("grammar")} icon={BookOpen} label="Ngữ pháp" />
            <NavTab active={view === "vocab" || view === "vocabDeck"} onClick={() => goto("vocab")} icon={Layers} label="Từ vựng" />
            <NavTab active={view === "quiz"} onClick={() => { resetQuiz(); goto("quiz"); }} icon={Target} label="Luyện tập" />
            <NavTab active={view === "leaderboard"} onClick={() => goto("leaderboard")} icon={Trophy} label="Xếp hạng" />
          </nav>
        </div>
      </header>

      <main style={{ maxWidth: 1040, margin: "0 auto", padding: "32px 24px 72px" }}>
        {view === "home" && <HomeView goto={goto} totalWordsSeen={totalWordsSeen} bestScore={bestScore} openTopic={openTopic} />}
        {view === "overview" && <OverviewView />}
        {view === "grammar" && <GrammarListView onOpen={openTopic} />}
        {view === "grammarDetail" && selectedTopic && (
          <GrammarDetailView topic={selectedTopic} onBack={() => goto("grammar")} onQuiz={() => { resetQuiz(); setQuizFilter("grammar"); goto("quiz"); }} />
        )}
        {view === "vocab" && <VocabHubView onOpen={openCategory} knownWords={knownWords} />}
        {view === "vocabDeck" && (
          <VocabDeckView category={cat} word={word} cardPos={cardPos} flipped={flipped} setFlipped={setFlipped}
            onNext={nextCard} onPrev={prevCard} onBack={() => goto("vocab")} markKnown={markKnown} markLearning={markLearning}
            knownWords={knownWords} learningWords={learningWords} isShuffled={!!deckOrder} onToggleShuffle={toggleShuffleDeck} />
        )}
        {view === "quiz" && quizStage === "setup" && (
          <QuizSetupView quizFilter={quizFilter} setQuizFilter={setQuizFilter} quizCount={quizCount} setQuizCount={setQuizCount} onStart={startQuiz} />
        )}
        {view === "quiz" && quizStage === "active" && quizQuestions.length > 0 && (
          <QuizActiveView question={quizQuestions[quizIndex]} index={quizIndex} total={quizQuestions.length}
            selectedOption={selectedOption} onAnswer={answerQuiz} onNext={nextQuestion} />
        )}
        {view === "quiz" && quizStage === "result" && (
          <QuizResultView score={finalScore} total={quizQuestions.length} answers={quizAnswers}
            playerName={playerName} setPlayerName={setPlayerName} nameSaved={nameSaved}
            onSave={saveScore} onRetry={resetQuiz} onLeaderboard={() => goto("leaderboard")} />
        )}
        {view === "leaderboard" && <LeaderboardView leaderboard={leaderboard} />}
      </main>

      <footer style={{ borderTop: `1px solid ${T.border}`, padding: "20px 24px", textAlign: "center", color: T.textSoft, fontSize: 13 }}>
        Bản demo tự học TOEIC — nội dung chỉ mang tính minh họa.
      </footer>
    </div>
  );
}

function GrammarDetailView({ topic, onBack, onQuiz }) {
  return (
    <div>
      <button onClick={onBack} style={{ ...ghostBtnStyle(), padding: "8px 14px", marginBottom: 20, fontSize: 13 }} className="app-btn"><ChevronLeft size={15} /> Quay lại</button>
      <div style={{ display: "flex", gap: 16, alignItems: "flex-start", marginBottom: 18 }}>
        <div style={{ width: 46, height: 46, borderRadius: 10, background: T.primarySoft, color: T.primaryDeep,

        <div>
          <h2 style={{ fontSize: 27, fontWeight: 800, margin: 0, letterSpacing: "-0.01em" }}>{topic.title}</h2>
          <div style={{ color: T.primary, fontFamily: "'IBM Plex Mono', monospace", fontSize: 13 }}>{topic.subtitle}</div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 26 }}>
        {topic.signals.map((s, i) => (
          <span key={i} style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, padding: "6px 12px",
            borderRadius: 8, background: T.primarySoft, color: T.primaryDeep }}>{s}</span>
        ))}
      </div>
      <SectionEyebrow>Ví dụ</SectionEyebrow>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 28 }}>
        {topic.examples.map((ex, i) => (
          <div key={i} style={cardStyle({ padding: "13px 16px" })}>
            <div style={{ fontWeight: 600, marginBottom: 3 }}>{ex.en}</div>
            <div style={{ color: T.textSoft, fontSize: 14 }}>{ex.vi}</div>
          </div>
        ))}
      </div>
      <button className="app-btn" onClick={onQuiz} style={primaryBtnStyle()}>Luyện tập chủ điểm này <Target size={16} /></button>
    </div>
  );
}

/* ============================== VOCABULARY ============================== */
function VocabHubView({ onOpen, knownWords }) {
  return (
    <div>
      <SectionEyebrow>Bộ thẻ từ vựng</SectionEyebrow>
      <h2 style={{ fontSize: 27, fontWeight: 800, margin: "0 0 20px", letterSpacing: "-0.01em" }}>Chọn một chủ đề để luyện flashcard</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(230px, 1fr))", gap: 14 }}>
        {VOCAB_CATEGORIES.map((c, idx) => {
          const known = c.words.filter((w) => knownWords[`${c.id}-${w.en}`]).length;
          const pct = Math.round((known / c.words.length) * 100);
          return (
            <button key={c.id} className="card-hover" onClick={() => onOpen(idx)} style={{ textAlign: "left", ...cardStyle({ padding: 16 }), cursor: "pointer" }}>
              <div style={{ fontWeight: 700, fontSize: 16.5, marginBottom: 4 }}>{c.name}</div>
              <div style={{ fontSize: 13, color: T.textSoft, lineHeight: 1.5, marginBottom: 12 }}>{c.tagline}</div>
              <div style={{ height: 5, background: T.border, borderRadius: 999, overflow: "hidden", marginBottom: 8 }}>
                <div className="progress-fill" style={{ height: "100%", width: `${pct}%`, background: T.success }} />
              </div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, color: T.textSoft }}>{c.words.length} từ · đã thuộc {known}</div>
            </button>
          );
        })}
      </div>
    </div>
  );
}
function VocabDeckView({ category, word, cardPos, flipped, setFlipped, onNext, onPrev, onBack, markKnown, markLearning, knownWords, learningWords, isShuffled, onToggleShuffle }) {
  const wordId = `${category.id}-${word.en}`;
  const isKnown = !!knownWords[wordId];
  const isLearning = !!learningWords[wordId];
  const knownCount = category.words.filter((w) => knownWords[`${category.id}-${w.en}`]).length;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 20 }}>
        <button onClick={onBack} style={{ ...ghostBtnStyle(), padding: "8px 14px", fontSize: 13 }} className="app-btn"><ChevronLeft size={15} /> Quay lại</button>
        <button onClick={onToggleShuffle} style={{ ...ghostBtnStyle(), padding: "8px 14px", fontSize: 13, background: isShuffled ? T.primarySoft : "#fff", color: isShuffled ? T.primaryDeep : T.text, borderColor: isShuffled ? T.primary : T.border }} className="app-btn">
          <Shuffle size={14} /> {isShuffled ? "Đang xáo trộn" : "Xáo trộn"}
        </button>
      </div>

      <SectionEyebrow>{category.name}</SectionEyebrow>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: T.textSoft }}>Thẻ {cardPos + 1} / {category.words.length}</div>
        <Badge tone="success">{knownCount}/{category.words.length} đã thuộc</Badge>
      </div>
      <div style={{ height: 5, background: T.border, borderRadius: 999, overflow: "hidden", marginBottom: 22 }}>
        <div className="progress-fill" style={{ height: "100%", width: `${((cardPos + 1) / category.words.length) * 100}%`, background: T.primary }} />
      </div>

      <div className="flip-scene" style={{ maxWidth: 440, margin: "0 auto 22px", height: 250 }}>
        <div className={`flip-card${flipped ? " is-flipped" : ""}`} style={{ width: "100%", height: "100%", cursor: "pointer" }} onClick={() => setFlipped((f) => !f)}>
          <div className="flip-face" style={{ ...cardStyle({ padding: 24 }), display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", boxShadow: "0 4px 16px rgba(15,23,42,0.06)" }}>
            <div style={{ position: "absolute", top: 14, left: 16, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: T.textSoft }}>EN → VI</div>
            {isKnown && <div style={{ position: "absolute", top: 14, right: 16 }}><Badge tone="success"><Check size={11}/> Đã thuộc</Badge></div>}
            <div style={{ fontWeight: 800, fontSize: 30, textAlign: "center", color: T.text }}>{word.en}</div>
            <div style={{ fontSize: 13, color: T.textSoft, marginTop: 14 }}>Nhấn để xem nghĩa</div>
          </div>
          <div className="flip-face flip-back" style={{ background: T.text, color: "#fff", borderRadius: 14, border: `1px solid ${T.text}`,
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, textAlign: "center" }}>
            <div style={{ fontWeight: 800, fontSize: 24, marginBottom: 10 }}>{word.vi}</div>
            <div style={{ fontSize: 13.5, opacity: 0.8, lineHeight: 1.5, fontStyle: "italic" }}>“{word.ex}”</div>
          </div>
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "center", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
        <button className="app-btn" onClick={onPrev} style={ghostBtnStyle()}><ChevronLeft size={16} /> Trước</button>
        <button className="app-btn" onClick={onNext} style={ghostBtnStyle()}>Tiếp <ChevronRight size={16} /></button>
      </div>
      <div style={{ display: "flex", justifyContent: "center", gap: 8, flexWrap: "wrap" }}>
        <button className="app-btn" onClick={() => { markLearning(wordId); onNext(); }}
          style={{ ...primaryBtnStyle(), background: isLearning ? T.dangerSoft : "#fff", color: isLearning ? T.danger : T.textSoft, border: `1.5px solid ${isLearning ? T.danger : T.border}` }}>
          <XIcon size={16} /> Chưa thuộc
        </button>
        <button className="app-btn" onClick={() => { markKnown(wordId); onNext(); }}
          style={{ ...primaryBtnStyle(), background: T.success }}>
          <Check size={16} /> Đã thuộc
        </button>
      </div>
    </div>
  );
}

/* ============================== QUIZ ============================== */
function QuizSetupView({ quizFilter, setQuizFilter, quizCount, setQuizCount, onStart }) {
  const filters = [{ id: "all", label: "Tất cả" }, { id: "grammar", label: "Ngữ pháp" }, { id: "vocab", label: "Từ vựng" }];
  const counts = [5, 10, 15, 20];
  return (
    <div>
      <SectionEyebrow>Phòng luyện tập</SectionEyebrow>
      <h2 style={{ fontSize: 27, fontWeight: 800, margin: "0 0 20px", letterSpacing: "-0.01em" }}>Thiết lập bài luyện tập</h2>
      <div style={cardStyle({ padding: 24, maxWidth: 480 })}>
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontWeight: 700, marginBottom: 10, fontSize: 14 }}>Nội dung</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {filters.map((f) => (
              <button key={f.id} onClick={() => setQuizFilter(f.id)} className="app-btn" style={{ padding: "8px 16px", borderRadius: 9,
                border: `1.5px solid ${quizFilter === f.id ? T.primary : T.border}`, background: quizFilter === f.id ? T.primary : "#fff",
                color: quizFilter === f.id ? "#fff" : T.text, fontWeight: 600, fontSize: 13.5, cursor: "pointer" }}>{f.label}</button>
            ))}
          </div>
        </div>
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontWeight: 700, marginBottom: 10, fontSize: 14 }}>Số câu hỏi</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {counts.map((c) => (
              <button key={c} onClick={() => setQuizCount(c)} className="app-btn" style={{ padding: "8px 16px", borderRadius: 9,
                border: `1.5px solid ${quizCount === c ? T.primary : T.border}`, background: quizCount === c ? T.primary : "#fff",
                color: quizCount === c ? "#fff" : T.text, fontWeight: 600, fontSize: 13.5, cursor: "pointer" }}>{c} câu</button>
            ))}
          </div>
        </div>
        <button className="app-btn" onClick={onStart} style={{ ...primaryBtnStyle(), width: "100%", justifyContent: "center" }}>Bắt đầu làm bài <ChevronRight size={16} /></button>
      </div>
    </div>
  );
}
function QuizActiveView({ question, index, total, selectedOption, onAnswer, onNext }) {
  const progress = (index / total) * 100;
  return (
    <div style={{ maxWidth: 540, margin: "0 auto" }}>
      <div style={{ height: 6, background: T.border, borderRadius: 999, overflow: "hidden", marginBottom: 18 }}>
        <div className="progress-fill" style={{ height: "100%", width: `${progress}%`, background: T.primary }} />
      </div>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, color: T.textSoft, marginBottom: 10 }}>Câu {index + 1} / {total}</div>
      <div style={cardStyle({ padding: "24px 22px", marginBottom: 18 })}>
        <div style={{ fontSize: 19, fontWeight: 700, lineHeight: 1.4 }}>{question.prompt}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 9, marginBottom: 20 }}>
        {question.options.map((opt, i) => {
          const isSelected = selectedOption === opt;
          const isCorrect = opt === question.correctAnswer;
          let bg = "#fff", border = T.border;
          if (selectedOption !== null) {
            if (isCorrect) { bg = T.successSoft; border = T.success; }
            else if (isSelected && !isCorrect) { bg = T.dangerSoft; border = T.danger; }
          }
          return (
            <button key={i} className="quiz-opt app-btn" disabled={selectedOption !== null} onClick={() => onAnswer(opt)}
              style={{ textAlign: "left", padding: "13px 16px", borderRadius: 10, border: `1.5px solid ${border}`,
                background: bg, color: T.text, fontSize: 15, cursor: selectedOption !== null ? "default" : "pointer",
                display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              {opt}
              {selectedOption !== null && isCorrect && <Check size={17} color={T.success} />}
              {selectedOption !== null && isSelected && !isCorrect && <XIcon size={17} color={T.danger} />}
            </button>
          );
        })}
      </div>
      {selectedOption !== null && (
        <button className="app-btn" onClick={onNext} style={{ ...primaryBtnStyle(), width: "100%", justifyContent: "center" }}>
          {index + 1 >= total ? "Xem kết quả" : "Câu tiếp theo"} <ChevronRight size={16} />
        </button>
      )}
    </div>
  );
}
function QuizResultView({ score, total, answers, playerName, setPlayerName, nameSaved, onSave, onRetry, onLeaderboard }) {
  const pct = Math.round((score / total) * 100);
  const missed = answers.filter((a) => !a.correct);
  return (
    <div style={{ maxWidth: 540, margin: "0 auto" }}>
      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <div style={{ width: 84, height: 84, borderRadius: "50%", background: pct >= 80 ? T.successSoft : pct >= 50 ? T.primarySoft : T.dangerSoft,
          display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto",
          fontFamily: "'IBM Plex Mono', monospace", fontWeight: 800, fontSize: 22, color: pct >= 80 ? T.success : pct >= 50 ? T.primaryDeep : T.danger }}>
          {pct}%
        </div>
        <h2 style={{ fontSize: 25, fontWeight: 800, margin: "16px 0 4px" }}>Bạn đúng {score}/{total} câu</h2>
        <p style={{ color: T.textSoft, fontSize: 15 }}>
          {pct >= 80 ? "Xuất sắc — bạn đã sẵn sàng cho vòng tiếp theo!" : pct >= 50 ? "Khá tốt, luyện thêm để chắc kiến thức nhé." : "Đừng nản — quay lại phần lý thuyết rồi thử lại!"}
        </p>
      </div>

      {!nameSaved ? (
        <div style={{ ...cardStyle({ padding: 16 }), marginBottom: 18, display: "flex", gap: 10, flexWrap: "wrap" }}>
          <input value={playerName} onChange={(e) => setPlayerName(e.target.value)} placeholder="Nhập tên của bạn"
            style={{ flex: 1, minWidth: 160, padding: "10px 14px", borderRadius: 9, border: `1.5px solid ${T.border}`,
              fontFamily: "'Inter', sans-serif", fontSize: 14, background: "#fff", color: T.text }} />
          <button className="app-btn" onClick={onSave} style={primaryBtnStyle()}>Lưu điểm <Trophy size={15} /></button>
        </div>
      ) : (
        <div style={{ textAlign: "center", color: T.success, fontWeight: 600, marginBottom: 18 }}>✓ Đã lưu kết quả vào bảng xếp hạng</div>
      )}

      {missed.length > 0 && (
        <>
          <SectionEyebrow>Xem lại câu sai</SectionEyebrow>
          <div style={{ display: "flex", flexDirection: "column", gap: 9, marginBottom: 22 }}>
            {missed.map((m, i) => (
              <div key={i} style={cardStyle({ padding: "13px 16px" })}>
                <div style={{ fontWeight: 600, marginBottom: 5 }}>{m.prompt}</div>
                <div style={{ fontSize: 13.5, color: T.danger }}>Bạn chọn: {m.chosen}</div>
                <div style={{ fontSize: 13.5, color: T.success }}>Đáp án đúng: {m.correctAnswer}</div>
              </div>
            ))}
          </div>
        </>
      )}

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <button className="app-btn" onClick={onRetry} style={ghostBtnStyle()}><RotateCcw size={16} /> Làm lại</button>
        <button className="app-btn" onClick={onLeaderboard} style={primaryBtnStyle()}>Xem bảng xếp hạng <ChevronRight size={16} /></button>
      </div>
    </div>
  );
}

/* ============================== LEADERBOARD ============================== */
function LeaderboardView({ leaderboard }) {
  const sorted = [...leaderboard].sort((a, b) => b.score / b.total - a.score / a.total);
  const medalColor = (i) => (i === 0 ? T.gold : i === 1 ? "#94A3B8" : i === 2 ? "#B08355" : T.border);
  return (
    <div>
      <SectionEyebrow>Xếp hạng</SectionEyebrow>
      <h2 style={{ fontSize: 27, fontWeight: 800, margin: "0 0 20px", letterSpacing: "-0.01em" }}>Bảng xếp hạng</h2>
      <div style={cardStyle({ overflow: "hidden" })}>
        {sorted.length === 0 && (
          <div style={{ padding: "24px 20px", textAlign: "center", color: T.textSoft, fontSize: 14 }}>
            Chưa có ai làm bài luyện tập. Hãy là người đầu tiên!
          </div>
        )}
        {sorted.map((row, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 20px",
            borderBottom: i < sorted.length - 1 ? `1px solid ${T.border}` : "none" }}>
            <div style={{ width: 30, height: 30, borderRadius: "50%", background: T.bg, border: `2px solid ${medalColor(i)}`,
              display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'IBM Plex Mono', monospace",
              fontWeight: 700, fontSize: 12.5, color: medalColor(i), flexShrink: 0 }}>{i + 1}</div>
            {i < 3 ? <Medal size={17} color={medalColor(i)} /> : <UserIcon size={17} color={T.textSoft} />}
            <div style={{ flex: 1, fontWeight: 600 }}>{row.name}</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, color: T.textSoft }}>{row.date}</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 14.5, minWidth: 50, textAlign: "right" }}>{row.score}/{row.total}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<RootApp />);
</script>
</body>
</html>
